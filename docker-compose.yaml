include:
  - external/docker/docker-compose.yaml
  - docker-compose.infra.yaml

services:
  game-service:
    image: ${GAME_SERVICE_IMAGE:-dragncardsai-game-service:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    build:
      context: .
      dockerfile: services/game-service/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      dragncards-backend:
        condition: service_started
      otel-lgtm:
        condition: service_healthy
    ports:
      - "${GAME_SERVICE_HOST_PORT:-4001}:8000"
    environment:
      DRAGNCARDS_HTTP_URL: ${DRAGNCARDS_HTTP_URL:-http://dragncards-backend:4000}
      DRAGNCARDS_WS_URL: ${DRAGNCARDS_WS_URL:-ws://dragncards-backend:4000/socket}
      VALKEY_URL: ${GAME_SERVICE_VALKEY_URL:-redis://game-service-valkey:6379/0}
      # History events go to the SHARED orchestrator Valkey (the history bus),
      # separate from the game-service's own session-store Valkey above.
      HISTORY_VALKEY_URL: ${GAME_SERVICE_HISTORY_VALKEY_URL:-redis://agent-orchestrator-valkey:6379/0}
      BOT_EMAIL: ${BOT_EMAIL:-dev_user@example.com}
      BOT_PASSWORD: ${BOT_PASSWORD:-password}
      HTTP_HOST: ${GAME_SERVICE_HTTP_HOST:-0.0.0.0}
      HTTP_PORT: ${GAME_SERVICE_HTTP_PORT:-8000}
      # TTL reaper for non-emitting ephemeral reconstruction sessions.
      EPHEMERAL_SESSION_TTL_SECONDS: ${EPHEMERAL_SESSION_TTL_SECONDS:-1800}
      EPHEMERAL_REAPER_INTERVAL_SECONDS: ${EPHEMERAL_REAPER_INTERVAL_SECONDS:-60}
      OTEL_SERVICE_NAME: ${GAME_SERVICE_OTEL_SERVICE_NAME:-game-service}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${GAME_SERVICE_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${GAME_SERVICE_OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_RESOURCE_ATTRIBUTES: ${GAME_SERVICE_OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local,service.namespace=dragncardsai}
    networks:
      - dragncards-shared

  agent-orchestrator:
    image: ${AGENT_ORCHESTRATOR_IMAGE:-dragncardsai-agent-orchestrator:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    build:
      context: .
      dockerfile: services/agent-orchestrator/docker/Dockerfile
    restart: unless-stopped
    env_file:
      - path: services/agent-orchestrator/.env
        required: false
    depends_on:
      agent-orchestrator-postgres:
        condition: service_healthy
      agent-orchestrator-valkey:
        condition: service_healthy
      bifrost:
        condition: service_healthy
      game-service:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy
    ports:
      - "${AGENT_ORCHESTRATOR_HOST_PORT:-4002}:8010"
    environment:
      DATABASE_URL: ${AGENT_ORCHESTRATOR_DATABASE_URL:-postgresql+asyncpg://postgres:postgres@agent-orchestrator-postgres:5432/agent_orchestrator}
      BIFROST_URL: ${BIFROST_URL:-http://bifrost:8080}
      BIFROST_API_KEY: ${BIFROST_API_KEY:-dummy}
      ENABLED_PROVIDER_IDS: ${ENABLED_PROVIDER_IDS:-nvidia,openrouter,mistral,claude,openai,lmstudio,gemini}
      HTTP_HOST: ${AGENT_ORCHESTRATOR_HTTP_HOST:-0.0.0.0}
      HTTP_PORT: ${AGENT_ORCHESTRATOR_HTTP_PORT:-8010}
      SKILL_ROOTS: ${SKILL_ROOTS:-/app/skills}
      GAME_SERVICE_MCP_URL: ${GAME_SERVICE_MCP_URL:-http://game-service:8000/mcp}
      VALKEY_URL: ${AGENT_ORCHESTRATOR_VALKEY_URL:-redis://agent-orchestrator-valkey:6379/0}
      OTEL_SERVICE_NAME: ${AGENT_ORCHESTRATOR_OTEL_SERVICE_NAME:-agent-orchestrator}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${AGENT_ORCHESTRATOR_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${AGENT_ORCHESTRATOR_OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_RESOURCE_ATTRIBUTES: ${AGENT_ORCHESTRATOR_OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local,service.namespace=dragncardsai}
    networks:
      - dragncards-shared

  history-service:
    image: ${HISTORY_SERVICE_IMAGE:-dragncardsai-history-service:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    build:
      context: .
      dockerfile: services/history-service/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      history-postgres:
        condition: service_healthy
      agent-orchestrator-valkey:
        condition: service_healthy
      game-service:
        condition: service_healthy
      agent-orchestrator:
        condition: service_started
    ports:
      - "${HISTORY_SERVICE_HOST_PORT:-4004}:4004"
    environment:
      HISTORY_DATABASE_URL: ${HISTORY_DATABASE_URL:-postgresql+asyncpg://postgres:postgres@history-postgres:5432/history_service}
      # The history:ingest bus lives on the shared agent-orchestrator Valkey so
      # all three services reach the same stream.
      VALKEY_URL: ${HISTORY_VALKEY_URL:-redis://agent-orchestrator-valkey:6379/0}
      GAME_SERVICE_BASE_URL: ${HISTORY_GAME_SERVICE_BASE_URL:-http://game-service:8000}
      AGENT_ORCHESTRATOR_BASE_URL: ${HISTORY_AGENT_ORCHESTRATOR_BASE_URL:-http://agent-orchestrator:8010}
      HTTP_HOST: ${HISTORY_SERVICE_HTTP_HOST:-0.0.0.0}
      HTTP_PORT: ${HISTORY_SERVICE_HTTP_PORT:-4004}
      OTEL_SERVICE_NAME: ${HISTORY_SERVICE_OTEL_SERVICE_NAME:-history-service}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${HISTORY_SERVICE_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${HISTORY_SERVICE_OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_RESOURCE_ATTRIBUTES: ${HISTORY_SERVICE_OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local,service.namespace=dragncardsai}
    networks:
      - dragncards-shared

  eval-service:
    image: ${EVAL_SERVICE_IMAGE:-dragncardsai-eval-service:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    build:
      context: .
      dockerfile: services/eval-service/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      eval-postgres:
        condition: service_healthy
      history-service:
        condition: service_started
      bifrost:
        condition: service_healthy
    ports:
      - "${EVAL_SERVICE_HOST_PORT:-4005}:4005"
    environment:
      # The eval-service connects to its OWN dedicated PostgreSQL (eval-postgres),
      # never the history-service or agent-orchestrator databases.
      EVAL_DATABASE_URL: ${EVAL_DATABASE_URL:-postgresql+asyncpg://postgres:postgres@eval-postgres:5432/eval_service}
      HISTORY_SERVICE_BASE_URL: ${EVAL_HISTORY_SERVICE_BASE_URL:-http://history-service:4004}
      BIFROST_URL: ${BIFROST_URL:-http://bifrost:8080}
      # The dedicated eval-judge virtual key; external/unset by default.
      BIFROST_API_KEY: ${EVAL_BIFROST_API_KEY:-dummy}
      # Required, no default: the judge model the eval-service routes to.
      EVAL_JUDGE_MODEL: ${EVAL_JUDGE_MODEL:-}
      EVAL_JUDGE_PROVIDER: ${EVAL_JUDGE_PROVIDER:-}
      EVALUATOR_VERSION: ${EVALUATOR_VERSION:-eval-1}
      HTTP_HOST: ${EVAL_SERVICE_HTTP_HOST:-0.0.0.0}
      HTTP_PORT: ${EVAL_SERVICE_HTTP_PORT:-4005}
      OTEL_SERVICE_NAME: ${EVAL_SERVICE_OTEL_SERVICE_NAME:-eval-service}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${EVAL_SERVICE_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${EVAL_SERVICE_OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_RESOURCE_ATTRIBUTES: ${EVAL_SERVICE_OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local,service.namespace=dragncardsai}
    networks:
      - dragncards-shared

  dashboard:
    image: ${DASHBOARD_IMAGE:-dragncardsai-dashboard:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    build:
      context: .
      dockerfile: services/dashboard/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      agent-orchestrator:
        condition: service_started
      game-service:
        condition: service_started
      history-service:
        condition: service_started
      eval-service:
        condition: service_started
      dragncards-frontend:
        condition: service_started
      otel-lgtm:
        condition: service_healthy
    ports:
      - "${DASHBOARD_HOST_PORT:-3001}:3000"
    environment:
      AGENT_ORCHESTRATOR_URL: ${AGENT_ORCHESTRATOR_URL:-http://agent-orchestrator:8010}
      GAME_SERVICE_URL: ${GAME_SERVICE_URL:-http://game-service:8000}
      HISTORY_SERVICE_URL: ${HISTORY_SERVICE_URL:-http://history-service:4004}
      EVAL_SERVICE_URL: ${EVAL_SERVICE_URL:-http://eval-service:4005}
      # Browser-reachable Bifrost UI (host port), not the internal BIFROST_URL.
      BIFROST_UI_URL: ${BIFROST_UI_URL:-http://localhost:4003}
      APP_NAME: ${APP_NAME:-DragnCardsAI Dashboard}
      DEFAULT_PROVIDER_ID: ${DEFAULT_PROVIDER_ID:-openrouter}
      DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-openrouter/openrouter/free}
      DEFAULT_REASONING_ENABLED: ${DEFAULT_REASONING_ENABLED:-true}
      DEFAULT_REASONING_EFFORT: ${DEFAULT_REASONING_EFFORT:-medium}
      DEFAULT_GAME_SERVICE_MCP_ENABLED: ${DEFAULT_GAME_SERVICE_MCP_ENABLED:-true}
      DEFAULT_GAME_SERVICE_MCP_NAME: ${DEFAULT_GAME_SERVICE_MCP_NAME:-game-service}
      DEFAULT_GAME_SERVICE_MCP_TRANSPORT: ${DEFAULT_GAME_SERVICE_MCP_TRANSPORT:-streamable-http}
      DEFAULT_GAME_SERVICE_MCP_URL: ${DEFAULT_GAME_SERVICE_MCP_URL:-http://game-service:8000/mcp/}
      OTEL_SERVICE_NAME: ${DASHBOARD_OTEL_SERVICE_NAME:-dashboard}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DASHBOARD_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-lgtm:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${DASHBOARD_OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_RESOURCE_ATTRIBUTES: ${DASHBOARD_OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local,service.namespace=dragncardsai}
    networks:
      - dragncards-shared

networks:
  dragncards-shared:
    name: dragncards-shared
