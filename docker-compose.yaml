include:
  - external/docker/docker-compose.yaml
  - docker-compose.infra.yaml

services:
  game-service:
    build:
      context: .
      dockerfile: services/game-service/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      - dragncards-backend
    ports:
      - "4001:8000"
    environment:
      DRAGNCARDS_HTTP_URL: http://dragncards-backend:4000
      DRAGNCARDS_WS_URL: ws://dragncards-backend:4000/socket
      VALKEY_URL: redis://game-service-valkey:6379/0
      BOT_EMAIL: dev_user@example.com
      BOT_PASSWORD: password
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8000"
    networks:
      - dragncards-shared

  agent-orchestrator:
    build:
      context: .
      dockerfile: services/agent-orchestrator/docker/Dockerfile
    restart: unless-stopped
    env_file:
      - path: services/agent-orchestrator/.env
        required: false
    depends_on:
      agent-orchestrator-postgres:
        condition: service_healthy
      agent-orchestrator-valkey:
        condition: service_healthy
      bifrost:
        condition: service_healthy
      game-service:
        condition: service_healthy
    ports:
      - "4002:8010"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@agent-orchestrator-postgres:5432/agent_orchestrator
      BIFROST_URL: http://bifrost:8080
      BIFROST_API_KEY: dummy
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8010"
      SKILL_ROOTS: /app/skills
      GAME_SERVICE_MCP_URL: http://game-service:8000/mcp
      VALKEY_URL: redis://agent-orchestrator-valkey:6379/0
      ENABLED_PROVIDER_IDS: ${ENABLED_PROVIDER_IDS:-openrouter}
      PROVIDER_MODELS_CACHE_TTL_SECONDS: ${PROVIDER_MODELS_CACHE_TTL_SECONDS:-600}
    networks:
      - dragncards-shared

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      agent-orchestrator:
        condition: service_started
      game-service:
        condition: service_started
      dragncards-frontend:
        condition: service_started
    ports:
      - "3001:3000"
    environment:
      AGENT_ORCHESTRATOR_URL: http://agent-orchestrator:8010
      GAME_SERVICE_URL: http://game-service:8000
      APP_NAME: DragnCardsAI Dashboard
      DEFAULT_PROVIDER_ID: openai
      DEFAULT_MODEL_NAME: gpt-4o-mini
      DEFAULT_GAME_SERVICE_MCP_ENABLED: "true"
      DEFAULT_GAME_SERVICE_MCP_NAME: game-service
      DEFAULT_GAME_SERVICE_MCP_TRANSPORT: streamable-http
      DEFAULT_GAME_SERVICE_MCP_URL: http://game-service:8000/mcp/
    networks:
      - dragncards-shared

networks:
  dragncards-shared:
    name: dragncards-shared
