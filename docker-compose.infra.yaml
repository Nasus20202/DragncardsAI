services:
  llama-cpp-smoke-model-cache:
    profiles: ["smoke"]
    image: curlimages/curl:8.20.0
    user: "0:0"
    restart: "no"
    entrypoint:
      - /bin/sh
      - -euc
      - |
        mkdir -p /models
        if [ ! -f "/models/${LLAMA_CPP_MODEL_FILE:-Qwen3.5-0.8B-Q4_K_M.gguf}" ]; then
          echo "Downloading smoke model ${LLAMA_CPP_MODEL_FILE:-Qwen3.5-0.8B-Q4_K_M.gguf}"
          curl --fail --location --silent --show-error \
            "${LLAMA_CPP_MODEL_URL:-https://huggingface.co/lmstudio-community/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_K_M.gguf?download=1}" \
            -o "/models/${LLAMA_CPP_MODEL_FILE:-Qwen3.5-0.8B-Q4_K_M.gguf}.part"
          mv "/models/${LLAMA_CPP_MODEL_FILE:-Qwen3.5-0.8B-Q4_K_M.gguf}.part" \
            "/models/${LLAMA_CPP_MODEL_FILE:-Qwen3.5-0.8B-Q4_K_M.gguf}"
        fi
    volumes:
      - "${LLAMA_CPP_MODEL_CACHE_DIR:-/tmp/dragncardsai-llama-cache}:/models"

  llama-cpp-smoke:
    profiles: ["smoke"]
    image: ghcr.io/ggml-org/llama.cpp:server-b9744
    restart: unless-stopped
    depends_on:
      llama-cpp-smoke-model-cache:
        condition: service_completed_successfully
    ports:
      - "${LLAMA_CPP_HOST_PORT:-1234}:1234"
    command:
      - --model
      - "/models/${LLAMA_CPP_MODEL_FILE:-Qwen3.5-0.8B-Q4_K_M.gguf}"
      - --host
      - 0.0.0.0
      - --port
      - "1234"
      - --alias
      - "${SMOKE_MODEL_NAME:-qwen3.5-0.8b}"
      # Keep llama.cpp smoke in single-slot mode; multi-slot startup has triggered GGML_ASSERT crashes in CI.
      - --parallel
      - "${LLAMA_CPP_PARALLEL:-1}"
      - --ctx-size
      - "${LLAMA_CPP_CTX_SIZE:-16384}"
      - --n-gpu-layers
      - "${LLAMA_CPP_N_GPU_LAYERS:-0}"
      # Skip warmup to reduce smoke stack startup time; healthcheck validates readiness before tests run.
      - --no-warmup
    volumes:
      - "${LLAMA_CPP_MODEL_CACHE_DIR:-/tmp/dragncardsai-llama-cache}:/models:ro"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:1234/health || curl -sf http://localhost:1234/v1/models",
        ]
      interval: 5s
      timeout: 3s
      start_period: 300s
      retries: 20
    networks:
      - dragncards-shared

  otel-lgtm:
    image: grafana/otel-lgtm:0.28.0
    restart: unless-stopped
    volumes:
      - otel-lgtm-data:/data
      - ./services/otel/loki-config.yaml:/otel-lgtm/loki-config.yaml:ro
      - ./services/otel/grafana/custom.ini:/otel-lgtm/grafana/conf/custom.ini:ro
      - ./services/otel/grafana/provisioning/dashboards/dragncardsai-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/dragncardsai-dashboards.yaml:ro
      - ./services/otel/grafana/dashboards:/otel-lgtm/grafana/dashboards:ro
    ports:
      - "${OTEL_LGTM_HOST_PORT:-3004}:3000"
      - "${OTEL_OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "${OTEL_OTLP_HTTP_HOST_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "sh", "-lc", "test -f /tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - dragncards-shared

  game-service-valkey:
    image: valkey/valkey:9.1.0-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${GAME_SERVICE_VALKEY_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dragncards-shared

  agent-orchestrator-valkey:
    image: valkey/valkey:9.1.0-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${AGENT_ORCHESTRATOR_VALKEY_HOST_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dragncards-shared

  agent-orchestrator-postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_orchestrator
    ports:
      - "${AGENT_ORCHESTRATOR_POSTGRES_HOST_PORT:-5441}:5432"
    volumes:
      - agent-orchestrator-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_orchestrator"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dragncards-shared

  lmstudio-proxy:
    image: alpine/socat:1.8.1.1
    restart: unless-stopped
    command: TCP-LISTEN:80,fork,reuseaddr TCP:host-gateway:${LMSTUDIO_HOST_PORT:-1234}
    extra_hosts:
      - "host-gateway:host-gateway"
    networks:
      - dragncards-shared

  bifrost:
    image: maximhq/bifrost:v1.5.16
    restart: unless-stopped
    depends_on:
      lmstudio-proxy:
        condition: service_started
      otel-lgtm:
        condition: service_healthy
    env_file:
      - path: services/bifrost/.env
        required: false
    environment:
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.namespace=dragncardsai
    volumes:
      - ./services/bifrost/config.json:/app/data/config.json:ro
    ports:
      - "${BIFROST_HOST_PORT:-4003}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "-O",
          "/dev/null",
          "http://localhost:8080/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dragncards-shared

networks:
  dragncards-shared:
    name: dragncards-shared

volumes:
  agent-orchestrator-postgres-data:
  otel-lgtm-data:
