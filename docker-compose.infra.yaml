services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.32.0
    restart: unless-stopped
    volumes:
      - otel-lgtm-data:/data
      - ./services/otel/loki-config.yaml:/otel-lgtm/loki-config.yaml:ro
      - ./services/otel/grafana/custom.ini:/otel-lgtm/grafana/conf/custom.ini:ro
      - ./services/otel/grafana/provisioning/dashboards/dragncardsai-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/dragncardsai-dashboards.yaml:ro
      - ./services/otel/grafana/dashboards:/otel-lgtm/grafana/dashboards:ro
    ports:
      - "${OTEL_LGTM_HOST_PORT:-3004}:3000"
      - "${OTEL_OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "${OTEL_OTLP_HTTP_HOST_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "sh", "-lc", "test -f /tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - dragncards-shared

  game-service-valkey:
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${GAME_SERVICE_VALKEY_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dragncards-shared

  agent-orchestrator-valkey:
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${AGENT_ORCHESTRATOR_VALKEY_HOST_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dragncards-shared

  agent-orchestrator-postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_orchestrator
    ports:
      - "${AGENT_ORCHESTRATOR_POSTGRES_HOST_PORT:-5441}:5432"
    volumes:
      - agent-orchestrator-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_orchestrator"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dragncards-shared

  history-postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: history_service
    ports:
      - "${HISTORY_POSTGRES_HOST_PORT:-5442}:5432"
    volumes:
      - history-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d history_service"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dragncards-shared

  eval-postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eval_service
    ports:
      - "${EVAL_POSTGRES_HOST_PORT:-5443}:5432"
    volumes:
      - eval-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eval_service"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dragncards-shared

  lmstudio-proxy:
    image: alpine/socat:1.8.1.3
    restart: unless-stopped
    command: TCP-LISTEN:80,fork,reuseaddr TCP:host-gateway:${LMSTUDIO_HOST_PORT:-1234}
    extra_hosts:
      - "host-gateway:host-gateway"
    networks:
      - dragncards-shared

  bifrost:
    image: maximhq/bifrost:v2.0.0
    restart: unless-stopped
    depends_on:
      lmstudio-proxy:
        condition: service_started
      otel-lgtm:
        condition: service_healthy
    env_file:
      - path: services/bifrost/.env
        required: false
    environment:
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.namespace=dragncardsai
    volumes:
      - ./services/bifrost/config.json:/app/data/config.json:ro
    ports:
      - "${BIFROST_HOST_PORT:-4003}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "-O",
          "/dev/null",
          "http://localhost:8080/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dragncards-shared

networks:
  dragncards-shared:
    name: dragncards-shared

volumes:
  agent-orchestrator-postgres-data:
  history-postgres-data:
  eval-postgres-data:
  otel-lgtm-data:
