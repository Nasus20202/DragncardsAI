services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.27.1
    restart: unless-stopped
    ports:
      - "3004:3000"
      - "4317:4317"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "sh", "-lc", "test -f /tmp/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - dragncards-shared

  game-service-valkey:
    image: valkey/valkey:9.0.4-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dragncards-shared

  agent-orchestrator-valkey:
    image: valkey/valkey:9.0.4-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dragncards-shared

  agent-orchestrator-postgres:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_orchestrator
    ports:
      - "5441:5432"
    volumes:
      - agent-orchestrator-postgres-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_orchestrator"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dragncards-shared

  bifrost:
    image: maximhq/bifrost:v1.5.0
    restart: unless-stopped
    depends_on:
      otel-lgtm:
        condition: service_healthy
    env_file:
      - path: services/bifrost/.env
        required: false
    environment:
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.namespace=dragncardsai
    volumes:
      - ./services/bifrost/config.json:/app/data/config.json:ro
    ports:
      - "4003:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dragncards-shared

networks:
  dragncards-shared:
    name: dragncards-shared

volumes:
  agent-orchestrator-postgres-data:
