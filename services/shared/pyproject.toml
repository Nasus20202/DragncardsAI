[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dragncards-common"
version = "0.1.0"
description = "Shared internal Python library for DragnCards backend services"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "sqlalchemy>=2.0.41",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "black>=26.0.0",
    "aiosqlite>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dragncards_common"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "black>=26.0.0",
    "aiosqlite>=0.21.0",
]

[tool.black]
line-length = 88
target-version = ["py314"]
