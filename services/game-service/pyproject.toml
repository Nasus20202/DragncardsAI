[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "game-service"
version = "0.1.0"
description = "DragnCards Game Service — HTTP API and MCP server for programmatic game interaction"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135",
    "uvicorn[standard]>=0.44",
    "websockets>=16",
    "httpx>=0.28.1",
    "pydantic>=2.12",
    "mcp>=1.27",
    "fastmcp>=3.2.3",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-otlp-proto-http>=1.41.0",
    "opentelemetry-instrumentation-fastapi>=0.62b0",
    "opentelemetry-instrumentation-httpx>=0.62b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "anyio[trio]>=4.13",
    "httpx>=0.28.1",
    "httpx2>=2.3.0",
    "black>=26.0.0",
]

[project.scripts]
game-service = "game_service.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/game_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: requires a running DragnCards backend (skipped automatically when unreachable)",
    "marvel_lcg: requires an explicitly enabled Marvel LCG integration profile",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "black>=26.0.0",
    "httpx2>=2.3.0",
]

[tool.black]
line-length = 88
target-version = ["py314"]
