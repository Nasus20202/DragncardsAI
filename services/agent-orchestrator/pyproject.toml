[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "DragnCards agent orchestrator service"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28.1",
    "pydantic>=2.12",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.0.41",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.21.0",
    "mcp>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
agent-orchestrator = "agent_orchestrator.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "postgres: requires a reachable PostgreSQL database (skipped automatically when unavailable)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.2",
]
