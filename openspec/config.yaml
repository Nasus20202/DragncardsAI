schema: spec-driven

context: |
  ## Project: DragnCardsAI

  An LLM-powered bot that plays Marvel Champions, a cooperative card game, on either
  the DragnCards playtable or the rules-enforcing marvel-lcg engine.

  ## Goal

  Build an AI agent that can observe and act within a Marvel Champions game on either
  supported platform. The system supports full game play: hero selection, deck loading,
  turn-by-turn decisions, and platform-specific move surfaces.

  ## Architecture

  ```
  Dashboard (Next.js)
       │
       ▼
  Agent Orchestrator ──────────────────▶ Bifrost AI Gateway
  (Python/FastAPI)                            │
       │                               ┌──────┴──────┐
       ▼                               ▼             ▼
   Game Service ──platform drivers──▶ DragnCards  lmstudio-proxy  External AI Providers
   (Python)                          (Phoenix)    (socat)          (OpenAI, Gemini, …)
       │                                  │            │
       ├──HTTP/JSON + render WebSocket──▶ marvel-lcg  ▼
       ▼                                             LM Studio
    Valkey                                         (host:1234)
   (events)
  ```

  ## Components

  - **game-service** (`services/game-service/`): Python service (FastAPI + MCP SDK).
    Selects a platform driver per session and exposes one neutral session, state, and
    history surface. The DragnCards driver uses Phoenix Channels; the marvel-lcg driver
    uses HTTP/JSON plus its render-frame WebSocket. Exposes:
    - HTTP REST API: session lifecycle, state queries, and platform-appropriate moves
    - MCP tools/resources: the same capabilities for LLM clients
    Both interfaces share a single `SessionManager` and platform-driver session pool.
  - **marvel-lcg engine**: The rules-enforcing Marvel Champions engine used by the
    `marvel-lcg` driver. It enumerates legal options instead of accepting arbitrary
    DragnLang. This integration credits the **Irefrixs Team**, the original authors of
    `irefrixs/marvel-lcg`, and uses the maintained `z00lus/marvel-lcg` Ronin Edition fork.
    The engine repository has no `LICENSE` file; this integration relies on the developer's
    explicit written permission recorded in [issue #3](https://github.com/irefrixs/marvel-lcg/issues/3).
    It is a fan implementation of Marvel/FFG intellectual property, and this repository
    does not claim ownership of that intellectual property. Card art is fetched from
    Cerebro at runtime and never redistributed here.
  - **agent-orchestrator** (`services/agent-orchestrator/`): Python/FastAPI service.
    Manages LLM sessions, job queues, skill assignment, and MCP wiring. Persists
    state in a dedicated PostgreSQL and fans out SSE events via Valkey. It is both
    an MCP client (attaching game-service tools to a session) and, at `/mcp`, an
    MCP server of its own.
  - **history-service** (`services/history-service/`): Python/FastAPI service.
    Ingests the Valkey `history:ingest` stream into its own PostgreSQL as an
    ordered, per-game event store with periodic snapshots, and can restore a
    session to any past moment.
  - **eval-service** (`services/eval-service/`): Python/FastAPI service. Reads
    recorded games from the history-service and produces per-player
    move/round/game evaluations, judging through Bifrost under a dedicated
    `eval-judge` identity and writing verdicts back to history. Uses its own
    PostgreSQL.
  - **dashboard** (`services/dashboard/`): Next.js UI for interacting with the
    agent-orchestrator, game-service, history-service, and eval-service.
  - **otel-lgtm**: `grafana/otel-lgtm` container in `docker-compose.infra.yaml`.
    Receives OTLP traces, metrics, and logs from every first-party service and the
    Bifrost gateway. The Python services share one bootstrap in
    `dragncards_common.telemetry`; see `openspec/specs/observability/spec.md`.
  - **dragncards-common** (`services/shared/`): Internal Python library shared by
    agent-orchestrator, history-service, and eval-service — schema-migration
    runner, RESP/Valkey client, typed Bifrost errors, httpx base client, the
    OpenTelemetry bootstrap, and the MCP-surface bootstrap that derives each
    service's `/mcp` tools from that service's own OpenAPI schema.
  - **bifrost** (`services/bifrost/`): Maximilian AI gateway (`maximhq/bifrost`).
    Routes LLM requests to configured providers. Local LM Studio traffic is routed
    via `lmstudio-proxy` (see below).
  - **lmstudio-proxy**: `alpine/socat` container in `docker-compose.infra.yaml`.
    Listens on port 80 inside the Docker network (`dragncards-shared`) and forwards
    connections to the host machine's LM Studio server (default host port 1234).
    Eliminates the need for `host.docker.internal` in any service config.
  - **DragnCards backend** (`external/dragncards/backend/`): Upstream Elixir/Phoenix app,
    tracked as a git submodule. Manages the DragnCards platform's game state, DragnLang
    automation, and phase/round logic.
    Runs in Docker. We never modify it.
  - **Marvel Champions plugin** (`external/dragncards-mc-plugin/`): Upstream Rust CLI for
    the DragnCards platform, tracked as a git submodule. Built as a multi-stage Docker image.
    Produces TSV + JSON artifacts mounted into the backend.
  - **External Docker config** (`external/docker/`): Dockerfiles and compose file for
    DragnCards backend, frontend, and mc-plugin.

  ## Tech Stack

  - Python 3.13+, FastAPI, MCP SDK (Python), websockets, httpx, pydantic
  - Elixir/Phoenix (upstream, Docker only — not modified)
  - PostgreSQL 18 (Docker)
  - pytest + pytest-asyncio, httpx ASGI transport for integration tests
  - Docker Compose for local development

  ## Key Protocols

  - **DragnCards Phoenix Channels wire format**: `[join_ref, ref, topic, event, payload]`
  - **DragnCards auth**: POST /api/v1/session → bearer token; passed as `authToken` query param on the WebSocket URL
  - **DragnCards room channel**: topic `room:<slug>`; join triggers `current_state` broadcast
  - **DragnCards game actions**: push `game_action` with a DragnLang payload
    `{"action": [...], "options": {"description": "..."}, "timestamp": <ms>}`
  - **DragnCards state events**: `current_state` (full), `state_update` (delta, marks state stale),
    `send_update` (legacy alias)
  - **DragnCards state request**: push `request_state` → server broadcasts `current_state`
  - **marvel-lcg transport**: authenticate over HTTP, fetch the version cookie, create a table,
    then use HTTP/JSON plus `WS /ws?p=<seat>` render frames; ask for legal options and submit a
    selected option by id with targets and resource payments.

  ## DragnLang Actions (DragnCards only)

  - `["NEXT_STEP"]` / `["PREV_STEP"]` — advance/rewind game phase
  - `["DRAW_CARD", player_n, count]` — draw cards
  - `["MOVE_CARD", card_id, dest_group_id, dest_stack_index, (dest_card_index)]`
  - `["SET", "/cardById/<id>/<path>", value]` — set card property

  ## Existing Specs

  - `openspec/specs/game-service/spec.md` — HTTP API, MCP, WebSocket, session mgmt, plugins, dual interface
  - `openspec/specs/dragncards/spec.md` — Integration contract with DragnCards (auth, room creation, channels, actions)
  - `openspec/specs/testing/spec.md` — Test suite requirements (unit isolation, integration layers, e2e)
  - `openspec/specs/infrastructure/spec.md` — Docker Compose layout, git submodules, build configuration

  ## Conventions

  - New capabilities use kebab-case folder names under `openspec/specs/`
  - Integration tests require a running DragnCards instance; unit tests run offline
  - Tests use `pytest-asyncio`; endpoints touching WebSocket use `httpx.AsyncClient` with ASGI transport
  - Session teardown in `finally` blocks — never leak sessions between tests
  - Environment variables for test config: DRAGNCARDS_HTTP_URL, DRAGNCARDS_WS_URL, DEV_USER_EMAIL, DEV_USER_PASSWORD, MC_PLUGIN_ID, MC_PLUGIN_VERSION

rules:
  proposal:
    - Keep proposals concise (1-2 pages). The "why" matters more than the "how".
    - Always include a Non-goals section to prevent scope creep.
    - List only capabilities that have spec-level requirement changes — not
      implementation details.
    - Check openspec/specs/ before naming new capabilities to avoid duplicates.

  specs:
    - Use SHALL/MUST for all normative requirements. Never use "should" or "may".
    - Every requirement MUST have at least one concrete WHEN/THEN scenario.
    - Scenarios must use exactly 4 hashtags (####). Never use 3 hashtags or
      bullets for scenarios.
    - Specs should be testable — each scenario is a potential test case.
    - When adding requirements for the game-service, check the existing spec
      first to avoid duplication.

  design:
    - Focus on architecture and key decisions, not line-by-line implementation.
    - Every decision MUST include alternatives considered and the reason they
      were rejected.
    - Explicitly call out risks that relate to the DragnCards WebSocket protocol
      or upstream behavior we don't control.

  tasks:
    - "Every task MUST use checkbox format: `- [ ] X.Y description`"
    - Tasks that touch the WebSocket/Phoenix layer should be separate from HTTP
      API tasks.
    - Include integration test tasks alongside the features they test (not as a
      separate phase at the end).
    - Keep tasks small — completable in a single focused session.
