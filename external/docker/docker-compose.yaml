services:
  dragncards-postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5440:5432"
    volumes:
      - dragncards-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dragncards-shared

  dragncards-mc-plugin:
    image: ${DRAGNCARDS_MC_PLUGIN_IMAGE:-dragncardsai-dragncards-mc-plugin:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    build:
      context: ../..
      dockerfile: external/docker/mc-plugin/Dockerfile
    restart: on-failure
    # Builds plugin artifacts and exits; artifacts stored in a named volume.
    volumes:
      - dragncards-mc-plugin-data:/output
    # The volume survives image rebuilds so game data is not lost. Replace only
    # the generated artifact directories before copying; copying a directory into
    # an existing directory leaves stale files at the mount root and nests the
    # new copy under json/json or tsv/tsv.
    entrypoint:
      - /bin/sh
      - -euc
      - |
        rm -rf /output/json /output/tsv
        mkdir -p /output/json /output/tsv
        cp -r /plugin/json/. /output/json/
        cp -r /plugin/tsv/. /output/tsv/
        echo 'Plugin artifacts copied to volume'
        ls -la /output/json/ /output/tsv/
    networks:
      - dragncards-shared

  dragncards-backend:
    image: ${DRAGNCARDS_BACKEND_IMAGE:-dragncardsai-dragncards-backend:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    build:
      context: ../..
      dockerfile: external/docker/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      dragncards-postgres:
        condition: service_healthy
      dragncards-mc-plugin:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
    volumes:
      - dragncards-mc-plugin-data:/plugin:ro
    environment:
      DB_HOSTNAME: dragncards-postgres
    networks:
      - dragncards-shared

  dragncards-frontend:
    image: ${DRAGNCARDS_FRONTEND_IMAGE:-dragncardsai-dragncards-frontend:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    build:
      context: ../..
      dockerfile: external/docker/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - dragncards-backend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_BE_HOSTNAME: dragncards-backend
    networks:
      - dragncards-shared

  marvel-lcg:
    image: ${MARVEL_LCG_IMAGE:-dragncardsai-marvel-lcg:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    build:
      context: ../..
      dockerfile: external/docker/marvel-lcg/Dockerfile
    restart: unless-stopped
    # The engine is a backend dependency. Keep its host binding loopback-only;
    # game-service reaches it over marvel-lcg-internal instead.
    ports:
      - "127.0.0.1:${MARVEL_LCG_PORT:-4006}:2345"
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /run/marvel-lcg:rw,noexec,nosuid,nodev,size=1m,uid=10001,gid=10001,mode=0700
    depends_on:
      marvel-lcg-init:
        condition: service_completed_successfully
    environment:
      # No default is intentional: the entrypoint refuses an empty password.
      MARVEL_LCG_PASSWORD: ${MARVEL_LCG_PASSWORD:-password}
    volumes:
      - marvel-lcg-assets:/app/assets
      - marvel-lcg-replays:/app/replays
      - marvel-lcg-runtime:/app/runtime
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2345/get_version', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12
    networks:
      - dragncards-shared
      - marvel-lcg-internal

  # Existing named volumes are commonly root-owned from older images. This
  # one-shot root helper makes upgrades safe without granting the game process
  # root or adding write access to the read-only application tree.
  marvel-lcg-init:
    image: alpine:3.24
    user: "0:0"
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - >-
        mkdir -p /assets /replays /runtime &&
        chown -R 10001:10001 /assets /replays /runtime
    volumes:
      - marvel-lcg-assets:/assets
      - marvel-lcg-replays:/replays
      - marvel-lcg-runtime:/runtime

networks:
  dragncards-shared:
    name: dragncards-shared
  marvel-lcg-internal:
    name: marvel-lcg-internal
    internal: true

volumes:
  dragncards-postgres-data:
  dragncards-mc-plugin-data:
  marvel-lcg-assets:
  marvel-lcg-replays:
  marvel-lcg-runtime:
