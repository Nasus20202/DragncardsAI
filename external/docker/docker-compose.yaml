services:
  dragncards-postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5440:5432"
    volumes:
      - dragncards-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dragncards-shared

  dragncards-mc-plugin:
    image: ${DRAGNCARDS_MC_PLUGIN_IMAGE:-dragncardsai-dragncards-mc-plugin:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    build:
      context: ../..
      dockerfile: external/docker/mc-plugin/Dockerfile
    restart: on-failure
    # Builds plugin artifacts and exits; artifacts stored in a named volume.
    volumes:
      - dragncards-mc-plugin-data:/output
    entrypoint: >
      sh -c "cp -r /plugin/json /output/json && cp -r /plugin/tsv /output/tsv && echo 'Plugin artifacts copied to volume' && ls -la /output/json/ /output/tsv/"
    networks:
      - dragncards-shared

  dragncards-backend:
    image: ${DRAGNCARDS_BACKEND_IMAGE:-dragncardsai-dragncards-backend:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    build:
      context: ../..
      dockerfile: external/docker/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      dragncards-postgres:
        condition: service_healthy
      dragncards-mc-plugin:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
    volumes:
      - dragncards-mc-plugin-data:/plugin:ro
    environment:
      DB_HOSTNAME: dragncards-postgres
    networks:
      - dragncards-shared

  dragncards-frontend:
    image: ${DRAGNCARDS_FRONTEND_IMAGE:-dragncardsai-dragncards-frontend:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-never}
    build:
      context: ../..
      dockerfile: external/docker/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - dragncards-backend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_BE_HOSTNAME: dragncards-backend
    networks:
      - dragncards-shared

networks:
  dragncards-shared:
    name: dragncards-shared

volumes:
  dragncards-postgres-data:
  dragncards-mc-plugin-data:
