name: Publish Docker Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository path for GHCR tags
        run: echo "GHCR_REPOSITORY=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set short SHA for image tags
        run: echo "SHORT_SHA=sha-${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Build and push Docker images
        uses: docker/bake-action@v7
        with:
          files: docker-compose.yaml
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            game-service.tags=ghcr.io/${{ env.GHCR_REPOSITORY }}/game-service:${{ env.SHORT_SHA }}
            game-service.tags=ghcr.io/${{ env.GHCR_REPOSITORY }}/game-service:latest
            agent-orchestrator.tags=ghcr.io/${{ env.GHCR_REPOSITORY }}/agent-orchestrator:${{ env.SHORT_SHA }}
            agent-orchestrator.tags=ghcr.io/${{ env.GHCR_REPOSITORY }}/agent-orchestrator:latest
            dashboard.tags=ghcr.io/${{ env.GHCR_REPOSITORY }}/dashboard:${{ env.SHORT_SHA }}
            dashboard.tags=ghcr.io/${{ env.GHCR_REPOSITORY }}/dashboard:latest
            dragncards-mc-plugin.tags=ghcr.io/${{ env.GHCR_REPOSITORY }}/dragncards-mc-plugin:${{ env.SHORT_SHA }}
            dragncards-mc-plugin.tags=ghcr.io/${{ env.GHCR_REPOSITORY }}/dragncards-mc-plugin:latest
            dragncards-backend.tags=ghcr.io/${{ env.GHCR_REPOSITORY }}/dragncards-backend:${{ env.SHORT_SHA }}
            dragncards-backend.tags=ghcr.io/${{ env.GHCR_REPOSITORY }}/dragncards-backend:latest
            dragncards-frontend.tags=ghcr.io/${{ env.GHCR_REPOSITORY }}/dragncards-frontend:${{ env.SHORT_SHA }}
            dragncards-frontend.tags=ghcr.io/${{ env.GHCR_REPOSITORY }}/dragncards-frontend:latest
