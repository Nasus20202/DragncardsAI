name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
            version: "0.12.8"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.24.0"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          cache: pnpm
          cache-dependency-path: services/dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        run: pnpm install --frozen-lockfile
        working-directory: services/dashboard
      - name: Run lint and format validation
        run: scripts/lint.sh

      - name: Run unit tests
        run: scripts/test.sh unit

      - name: Build Docker stack
        uses: docker/bake-action@v7
        with:
          files: docker-compose.yaml
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            *.output=type=docker

      - name: Start Docker stack
        env:
          MARVEL_LCG_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose up -d --no-build
      - name: Wait for backend
        run: |
          for attempt in $(seq 1 300); do
            if curl -sS -o /dev/null http://localhost:4000; then
              echo "DragnCards backend is reachable"
              exit 0
            fi
            sleep 1
          done
          echo "DragnCards backend did not become reachable in time" >&2
          exit 1

      - name: Run integration tests
        run: scripts/test.sh integration

      - name: Dump container logs
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=100
      - name: Stop Docker stack
        if: always()
        run: scripts/docker.sh down
