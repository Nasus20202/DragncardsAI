name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            services/dashboard/pnpm-lock.yaml
            services/smoketest/pnpm-lock.yaml

      - name: Cache llama.cpp smoke model
        uses: actions/cache@v5
        with:
          path: ~/.cache/dragncardsai/llama.cpp
          key: llama-cpp-smoke-qwen3.5-0.8b-q4km-v1

      - name: Install dashboard dependencies
        run: pnpm install --frozen-lockfile
        working-directory: services/dashboard

      - name: Install smoketest dependencies
        run: pnpm install --frozen-lockfile
        working-directory: services/smoketest

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: services/smoketest

      - name: Run lint and format validation
        run: scripts/lint.sh

      - name: Run unit tests
        run: scripts/test.sh unit

      - name: Build Docker stack
        uses: docker/bake-action@v7
        with:
          files: docker-compose.yaml
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            *.output=type=docker

      - name: Start Docker stack
        env:
          DEFAULT_PROVIDER_ID: lmstudio
          DEFAULT_MODEL_NAME: qwen3.5-0.8b
          ENABLED_PROVIDER_IDS: lmstudio
        run: ./services/smoketest/smoke.sh up --no-build

      - name: Wait for backend
        run: |
          for attempt in $(seq 1 300); do
            if curl -sS -o /dev/null http://localhost:4000; then
              echo "DragnCards backend is reachable"
              exit 0
            fi
            sleep 1
          done
          echo "DragnCards backend did not become reachable in time" >&2
          exit 1

      - name: Run integration tests
        run: scripts/test.sh integration

      - name: Run smoke test
        env:
          SMOKE_MODEL_PROVIDER_ID: lmstudio
          SMOKE_MODEL_NAME: qwen3.5-0.8b
          LLAMA_CPP_SMOKE_URL: http://127.0.0.1:1234/v1
          DASHBOARD_SMOKE_BASE_URL: http://127.0.0.1:3001
          AGENT_ORCHESTRATOR_SMOKE_URL: http://127.0.0.1:4002
          GAME_SERVICE_SMOKE_URL: http://127.0.0.1:4001
        run: services/smoketest/smoke.sh test

      - name: Stop Docker stack
        if: always()
        run: scripts/docker.sh down
