name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: services/dashboard/pnpm-lock.yaml

      - name: Run unit tests
        run: scripts/test.sh unit

      - name: Build Docker stack
        uses: docker/bake-action@v7
        with:
          files: docker-compose.yaml
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            *.output=type=docker

      - name: Start Docker stack
        run: scripts/docker.sh start

      - name: Wait for backend
        run: |
          for attempt in $(seq 1 300); do
            if curl -sS -o /dev/null http://localhost:4000; then
              echo "DragnCards backend is reachable"
              exit 0
            fi
            sleep 1
          done
          echo "DragnCards backend did not become reachable in time" >&2
          exit 1

      - name: Run integration tests
        run: scripts/test.sh integration

      - name: Stop Docker stack
        if: always()
        run: scripts/docker.sh down
